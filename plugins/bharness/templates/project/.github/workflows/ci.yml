name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    env:
      # Valeurs factices : la CI construit l'app sans se connecter à Supabase.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - name: Pas encore d'application
        if: hashFiles('package.json') == ''
        run: echo "Aucun package.json pour l'instant, rien à vérifier."

      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Vérifier le code
        if: hashFiles('package.json') != ''
        run: npm run lint

      - name: Vérifier les types
        if: hashFiles('package.json') != ''
        run: npm run typecheck

      - name: Tests unitaires et fonctionnels
        if: hashFiles('package.json') != ''
        run: npm test

      - name: Construire l'application
        if: hashFiles('package.json') != ''
        run: npm run build
