<!DOCTYPE html>
<!--
  Menu des maquettes (modèle Bharness). Iris copie ce fichier en docs/maquettes/index.html
  et remplace tout ce qui est entre {{ }}. Une carte par écran principal, regroupées par parcours.
  Chaque maquette d'écran doit contenir, tout en haut, un lien « Menu » vers index.html :
    <a href="index.html" class="fixed left-3 top-3 z-50 rounded-full bg-white/90 px-3 py-1 text-sm shadow">← Menu</a>
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maquettes · {{nom du projet}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <main class="mx-auto max-w-2xl px-4 py-8">
    <p class="text-sm text-slate-500">Maquettes à valider · {{date}}</p>
    <h1 class="mt-1 text-2xl font-bold">{{nom du projet}}</h1>
    <p class="mt-2 text-slate-600">
      Clique sur un écran pour le voir. Ce sont des dessins pour valider l'idée : rien n'est encore branché.
      Utilise « ← Menu » en haut à gauche pour revenir ici.
    </p>

    <!-- Répéter ce bloc pour chaque parcours -->
    <section class="mt-8">
      <h2 class="text-lg font-semibold">{{nom du parcours}}</h2>
      <ul class="mt-3 space-y-3">
        <!-- Répéter cet élément pour chaque écran du parcours -->
        <li>
          <a href="{{fichier-ecran}}.html" class="block rounded-xl border border-slate-200 bg-white p-4 shadow-sm hover:border-slate-400">
            <span class="block font-medium">{{numéro}}. {{nom de l'écran}}</span>
            <span class="mt-1 block text-sm text-slate-600">{{but de l'écran en une phrase}}</span>
          </a>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
